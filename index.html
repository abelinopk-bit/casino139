$('g').innerHTML=arc('DOMINO GAPLEK')+(Dm.ph=='play'?`<div class="bar">`+Dm.h.map((h,i)=>i?`<span class="pl ${Dm.t==i?'on':''}">🤖 Bot ${i} · ${h.length} 🁢</span>`:'').join('')+`<span class="pl">Pot <b style="color:var(--gold)">${Dm.pot}</b> · Tumpukan ${Dm.bone.length}</span></div>`:npb('dmI'))+`<div class="cn">${Dm.ch.map(t=>dmt(t)).join('')||'<div class="lbl">Meja kosong</div>'}</div><div class="msg" id="ms">${Dm.msg}</div><div class="row" style="padding-left:0;flex-wrap:wrap">${my.map((t,k)=>dmt(t,'',`onclick="dmC(${k})" style="${Dm.sel==k?'outline:3px solid var(--gold)':''}"`)).join('')}</div>`+
(Dm.sel!=null?`<div class="bar"><button onclick="dmPl(0,Dm.sel,'L')">◀ Kiri</button><button onclick="dmPl(0,Dm.sel,'R')">Kanan ▶</button></div>`:'')+(np?`<div class="bar">${Dm.bone.length?`<button onclick="dmDraw()">Ambil dari tumpukan</button>`:`<button class="s" onclick="dmPass()">Lewati giliran</button>`}</div>`:'')+(Dm.ph!='play'?chips()+'<div class="bar"><button onclick="dmGo()">BAGI DOMINO</button></div>':'')}
function dmPick(i){const e=dmE();let b=null,bv=-1;Dm.h[i].forEach((t,k)=>{if(!Dm.ch.length||dmOk(t,e[0])||dmOk(t,e[1])){const v=t[0]+t[1];if(v>bv){bv=v;b=[k,!Dm.ch.length||dmOk(t,e[1])?'R':'L']}}});return b}
function dmPl(i,k,side){const t=Dm.h[i].splice(k,1)[0];Dm.sel=null;if(!Dm.ch.length)Dm.ch.push(t);else if(side=='L'){const e=Dm.ch[0][0];Dm.ch.unshift(t[1]==e?t:[t[1],t[0]])}else{const e=Dm.ch[Dm.ch.length-1][1];Dm.ch.push(t[0]==e?t:[t[1],t[0]])}Dm.ps=0;snd('deal');
if(!Dm.h[i].length)return dmEnd(i,(i?'Bot '+i:'Kamu')+' habis kartu!');dmNx((i?'Bot '+i:'Kamu')+' main '+DF[t[0]]+DF[t[1]])}
function dmNx(m){Dm.t=(Dm.t+1)%NP;Dm.msg=m+' → '+(Dm.t?'Bot '+Dm.t:'giliranmu');dmR();if(Dm.t)wt(dmBot,800)}
function dmBot(){if(Dm.over)return;const i=Dm.t;let p=dmPick(i);while(!p&&Dm.bone.length){Dm.h[i].push(Dm.bone.pop());p=dmPick(i)}
if(p)return dmPl(i,p[0],p[1]);Dm.ps++;if(Dm.ps>=NP)return dmBlock();dmNx('Bot '+i+' lewati')}
function dmC(k){if(Dm.ph!='play'||Dm.t||Dm.over)return;const t=Dm.h[0][k],e=dmE();if(!Dm.ch.length)return dmPl(0,k,'R');const L=dmOk(t,e[0]),R=dmOk(t,e[1]);if(!L&&!R){snd('lose');return}
if(L&&R&&e[0]!=e[1]){Dm.sel=k;Dm.msg='Pasang di sisi mana?';return dmR()}dmPl(0,k,R?'R':'L')}
function dmDraw(){Dm.h[0].push(Dm.bone.pop());snd('deal');dmR()}
function dmPass(){Dm.ps++;if(Dm.ps>=NP)return dmBlock();dmNx('Kamu lewati')}
function dmBlock(){const s=Dm.h.map(h=>h.reduce((a,t)=>a+t[0]+t[1],0));dmEnd(s.indexOf(Math.min(...s)),'Meja buntu! Poin terkecil menang.')}
function dmEnd(w,m){Dm.over=1;Dm.ph='end';if(w==0){pay(Dm.pot);fx(1,1);m='🏆 '+m+' +'+Dm.pot}else{fx(0);m='Bot '+w+' menang. '+m}Dm.msg=m;dmR()}
// ----- TEXAS POKER -----
const PH=['High Card','Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];let Pk;
function h5(h){const v=h.map(c=>rk(c.r)).sort((a,b)=>b-a),fl=h.every(c=>c.s==h[0].s),cn={};v.forEach(x=>cn[x]=(cn[x]||0)+1);const g=Object.keys(cn).map(Number).sort((a,b)=>cn[b]-cn[a]||b-a),k=g.map(x=>cn[x]);let st=new Set(v).size==5&&v[0]-v[4]==4,hi=v[0];if(v.join()=='14,5,4,3,2'){st=1;hi=5}
return[st&&fl?8:k[0]==4?7:k[0]==3&&k[1]==2?6:fl?5:st?4:k[0]==3?3:k[0]==2&&k[1]==2?2:k[0]==2?1:0,...(st?[hi]:g)]}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
function best(h){let b=null;for(let i=0;i<h.length;i++)for(let j=i+1;j<h.length;j++){const s=h5(h.filter((_,x)=>x!=i&&x!=j));if(!b||cmp(s,b)>0)b=s}return b}
const vis=()=>[0,3,4,5][Pk.st];
function bs(i){const c=Pk.p[i].concat(Pk.b.slice(0,vis()));if(c.length<5){const a=rk(c[0].r),b=rk(c[1].r),hi=Math.max(a,b),lo=Math.min(a,b);return a==b?.75+hi/60:(hi+lo)/40+(c[0].s==c[1].s?.06:0)+(hi-lo<3?.04:0)}const s=best(c);return Math.min(1,.3+s[0]*.14+(s[0]?0:s[1]/70))}
function pkI(){Pk={ph:'bet',p:[],b:[],f:[],st:0,pot:0,msg:'Pasang ante, lalu bagi kartu'};pkR()}
function pkGo(){if(S.chips<S.bet){Pk.msg='Chip kurang';return pkR()}const u=S.bet;pay(-u);snd('deal');const d=mk();Pk={ph:'act',u,pot:u*NP,p:Array.from({length:NP},()=>d.splice(0,2)),b:d.splice(0,5),f:Array(NP).fill(0),st:0,msg:'Preflop – Check atau Bet '+u+'?'};pkR()}
function pkR(){const end=Pk.ph=='end',v=Pk.ph=='bet'?0:vis();
$('g').innerHTML=arc('TEXAS HOLD’EM')+(Pk.ph=='bet'||end?npb('pkI'):'')+'<div class="bar">'+Pk.p.map((h,i)=>i?`<div class="pl ${Pk.f[i]?'':'on'}">🤖 Bot ${i}${Pk.f[i]?' (fold)':''}<div class="row sm" style="padding-left:14px">${h.map(c=>cd(c,!end||Pk.f[i])).join('')}</div></div>`:'').join('')+`</div><div class="lbl">Pot<b>${Pk.pot}</b></div><div class="row">${Pk.b.slice(0,v).map(c=>cd(c)).join('')||'<div class="lbl">— kartu komunal —</div>'}</div><div class="msg" id="ms">${Pk.msg}</div><div class="row">${(Pk.p[0]||[]).map(c=>cd(c)).join('')}</div>`+(Pk.p[0]&&v>=3?`<div class="lbl">${PH[best(Pk.p[0].concat(Pk.b.slice(0,v)))[0]]}</div>`:'')+
(Pk.ph=='act'?`<div class="bar"><button class="s" onclick="pkAct('chk')">Check</button><button onclick="pkAct('bet')">Bet ${Pk.u}</button><button class="r" onclick="pkAct('fold')">Fold</button></div>`:Pk.ph=='resp'?`<div class="bar"><button onclick="pkAct('call')">Call ${Pk.u}</button><button class="r" onclick="pkAct('fold')">Fold</button></div>`:chips()+'<div class="bar"><button onclick="pkGo()">BAGI KARTU</button></div>')}
function pkAct(a){const u=Pk.u;if(a=='fold'){Pk.ph='end';Pk.msg='Kamu fold. Pot hilang 😔';fx(0);return pkR()}
if(a=='call'||a=='bet'){if(S.chips<u)return say('Chip kurang');pay(-u);snd('chip');Pk.pot+=u;
if(a=='call')Pk.pot+=u;else{for(let i=1;i<NP;i++)if(!Pk.f[i]){if(bs(i)+Math.random()*.25-.12<.38)Pk.f[i]=1;else Pk.pot+=u}if(Pk.f.slice(1).every(x=>x))return pkEnd([0],'Semua bot fold!')}return pkNext()}
for(let i=1;i<NP;i++)if(!Pk.f[i]&&bs(i)>.68&&Math.random()<.5){Pk.ph='resp';Pk.msg='Bot '+i+' bet '+u+'! Call atau Fold?';return pkR()}pkNext()}
function pkNext(){if(Pk.st==3){const a=[];let bt=null;Pk.p.forEach((h,i)=>{if(!Pk.f[i]){const s=best(h.concat(Pk.b));if(!bt||cmp(s,bt)>0){bt=s;a.length=0;a.push(i)}else if(!cmp(s,bt))a.push(i)}});return pkEnd(a,(a[0]?'Bot '+a[0]:'Kamu')+' – '+PH[bt[0]])}
Pk.st++;Pk.ph='act';Pk.msg=['','Flop','Turn','River'][Pk.st]+' – Check atau Bet '+Pk.u+'?';snd('deal');pkR()}
function pkEnd(w,m){Pk.ph='end';const sh=Pk.pot/w.length|0;if(w.includes(0)){pay(sh);fx(1,sh>=Pk.u*6);m='🏆 '+m+' +'+sh}else{fx(0);m='Kalah. '+m}Pk.msg=m;pkR()}
// ----- TRADING -----
let Tr;
function trS(){const l=Tr.p[Tr.p.length-1];Tr.dr=Tr.dr*.85+(Math.random()-.5)*.006;Tr.p.push(Math.max(20,l*(1+(Math.random()-.5)*.024+Tr.dr)));if(Tr.p.length>60)Tr.p.shift()}
const trV=()=>{if(!Tr.pos)return 0;const o=Tr.pos;return o.m*(1+o.d*o.lev*(Tr.p[Tr.p.length-1]/o.e-1))};
function trI(){Tr={p:[100],pos:null,lev:5,dr:0,msg:'Tebak arah harga: Long (naik) atau Short (turun)'};for(let i=0;i<40;i++)trS();trR();const t=GT;clearInterval(TRI);TRI=setInterval(()=>{if(t!=GT)return clearInterval(TRI);trS();if(Tr.pos&&trV()<=0){Tr.pos=null;Tr.msg='💥 Likuidasi! Margin hangus';fx(0);return trR()}trD()},650)}
function trD(){const p=Tr.p,mn=Math.min(...p),mx=Math.max(...p),y=v=>(150-(v-mn)/(mx-mn||1)*140).toFixed(1),l=p[p.length-1],c=l>=p[0]?'#4ade80':'#ff6b70',pts=p.map((v,i)=>(i*400/(p.length-1)).toFixed(1)+','+y(v)).join(' ');
$('tc').innerHTML=`<svg viewBox="0 0 400 160">${[0,1,2,3].map(i=>`<line x1="0" x2="400" y1="${10+i*46}" y2="${10+i*46}" stroke="#38e8ff22"/>`).join('')}<polygon points="0,160 ${pts} 400,160" fill="${c}22"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5"/>${Tr.pos?`<line x1="0" x2="400" y1="${y(Tr.pos.e)}" y2="${y(Tr.pos.e)}" stroke="#f6c945" stroke-dasharray="5"/>`:''}<circle cx="400" cy="${y(l)}" r="4" fill="${c}"/></svg>`;
const v=trV();$('ts').innerHTML=`<span style="color:${c}">$${l.toFixed(2)}</span>`+(Tr.pos?` · ${Tr.pos.d>0?'LONG':'SHORT'} ×${Tr.pos.lev} · nilai <b style="color:${v>=Tr.pos.m?'#4ade80':'#ff6b70'}">${Math.floor(v)}</b>`:'')}
function trR(){$('g').innerHTML=arc('TRADING LIVE')+'<div class="tc" id="tc"></div><div class="lbl" id="ts" style="font-size:15px;margin:8px 0"></div><div class="msg" id="ms">'+Tr.msg+'</div>'+(Tr.pos?'<div class="bar"><button onclick="trClose()">TUTUP POSISI</button></div>':'<div class="bar">Leverage '+[2,5,10].map(n=>`<button class="${Tr.lev==n?'':'s'}" onclick="Tr.lev=${n};trR()">×${n}</button>`).join('')+'</div>'+chips()+'<div class="bar"><button onclick="trOpen(1)" style="background:linear-gradient(#6ee7a0,#22a85a);color:#04210f">▲ LONG</button><button class="r" onclick="trOpen(-1)">▼ SHORT</button></div>');trD()}
function trOpen(d){if(S.chips<S.bet)return say('Chip kurang');pay(-S.bet);snd('chip');Tr.pos={d,e:Tr.p[Tr.p.length-1],m:S.bet,lev:Tr.lev};Tr.msg='Posisi dibuka. Tutup sebelum terlikuidasi!';trR()}
function trClose(){const o=Tr.pos,g=Math.floor(Math.max(trV()*(1-.002*o.lev),0));pay(g);Tr.pos=null;Tr.msg=g>o.m?'✅ Profit +'+(g-o.m):g==o.m?'Impas':'❌ Rugi '+(g-o.m);fx(g>o.m,g>=o.m*1.5);trR()}
// ----- CATUR (AI / 2 PEMAIN) -----
function chI(){X={b:Array.from('rnbqkbnrpppppppp'+' '.repeat(32)+'PPPPPPPPRNBQKBNR',c=>c==' '?'':c),sel:null,w:true,over:0,ai:0,msg:CM?'Giliran Putih ♙':'Giliranmu (putih) · menang +150 chip'};chR()}
function chR(){const tg=X.sel==null?[]:legal(X.b,X.w).filter(m=>m[0]==X.sel).map(m=>m[1]);
$('g').innerHTML=arc('CYBER CHESS')+`<div class="bar"><button class="${CM?'s':''}" onclick="CM=0;chI()">🤖 vs AI</button><button class="${CM?'':'s'}" onclick="CM=1;chI()">👥 2 Pemain</button></div><div class="chess">`+X.b.map((c,i)=>`<div class="sq ${((i>>3)+i)%2?'d':'l'} ${X.sel==i?'s':''} ${tg.includes(i)?'t':''}" onclick="chC(${i})">${c?`<span class="${isW(c)?'pw':'pb'}">${GL[c.toLowerCase()]}\uFE0E</span>`:''}</div>`).join('')+`</div><div class="msg" id="ms">${X.msg}</div><div class="bar"><button class="s" onclick="chI()">Game Baru</button></div>`}
function chC(i){if(X.over||X.ai)return;const c=X.b[i];if(c&&isW(c)==X.w){X.sel=i;snd('tick');return chR()}
if(X.sel!=null&&legal(X.b,X.w).some(m=>m[0]==X.sel&&m[1]==i)){X.b=ap(X.b,[X.sel,i]);X.sel=null;snd('deal');
if(CM){X.w=!X.w;if(!legal(X.b,X.w).length)return chEnd(inCk(X.b,X.w)?(X.w?'B':'W'):'D');X.msg=(X.w?'Giliran Putih ♙':'Giliran Hitam ♟')+(inCk(X.b,X.w)?' · Skak!':'');return chR()}
if(!legal(X.b,false).length)return chEnd(inCk(X.b,false)?'W':'D');X.ai=1;X.msg='AI berpikir...';chR();wt(chAI,300)}}
function chAI(){const Lg=legal(X.b,false);let best=-1e9,bm;for(const m of Lg){const v=-nm(ap(X.b,m),true,2,-1e9,1e9)+Math.random()*.3;if(v>best){best=v;bm=m}}X.b=ap(X.b,bm);X.ai=0;snd('deal');if(!legal(X.b,true).length)return chEnd(inCk(X.b,true)?'B':'D');X.msg=inCk(X.b,true)?'Skak! ♚':'Giliranmu';chR()}
function chEnd(r){X.over=1;X.ai=0;if(r=='D')X.msg='Remis (stalemate)';else if(CM){X.msg='SKAKMAT! '+(r=='W'?'Putih':'Hitam')+' menang 🎉';snd('win')}else if(r=='W'){pay(150);X.msg='SKAKMAT! Kamu menang +150 🎉';fx(1,1)}else{X.msg='Skakmat. AI menang';fx(0)}chR()}
home();
