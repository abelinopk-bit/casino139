else if(t=='k'){for(let a=-1;a<2;a++)for(let e=-1;e<2;e++)(a||e)&&add(r+a,f+e)}
else{const R=[[1,0],[-1,0],[0,1],[0,-1]],Bi=[[1,1],[1,-1],[-1,1],[-1,-1]];(t=='r'?R:t=='b'?Bi:R.concat(Bi)).forEach(([a,e])=>{let y=r+a,x=f+e;while(add(y,x)){y+=a;x+=e}})}}return o}
function ap(b,m){const n=b.slice(),c=n[m[0]];n[m[1]]=c=='P'&&m[1]<8?'Q':c=='p'&&m[1]>55?'q':c;n[m[0]]='';return n}
const inCk=(b,w)=>{const k=b.indexOf(w?'K':'k');return k<0||mvs(b,!w).some(m=>m[1]==k)};
const legal=(b,w)=>mvs(b,w).filter(m=>!inCk(ap(b,m),w));
function evb(b){let s=0;b.forEach((c,i)=>{if(c){const v=PV[c.toLowerCase()]*10+((i>>3)>1&&(i>>3)<6&&(i&7)>1&&(i&7)<6?1:0);s+=isW(c)?v:-v}});return s}
function nm(b,w,d,a,be){if(!d)return(w?1:-1)*evb(b);let best=-1e9;for(const m of mvs(b,w)){const t=b[m[1]],v=t&&t.toLowerCase()=='k'?1e6:-nm(ap(b,m),!w,d-1,-be,-a);if(v>best)best=v;if(best>a)a=best;if(a>=be)break}return best}
function chI(){X={b:Array.from('rnbqkbnrpppppppp'+' '.repeat(32)+'PPPPPPPPRNBQKBNR',c=>c==' '?'':c),sel:null,msg:'Giliranmu (putih) · menang +150 chip',over:0,ai:0};chR()}
function chR(){const tg=X.sel==null?[]:legal(X.b,true).filter(m=>m[0]==X.sel).map(m=>m[1]);
$('g').innerHTML=arc('CYBER CHESS')+'<div class="chess">'+X.b.map((c,i)=>`<div class="sq ${((i>>3)+i)%2?'d':'l'} ${X.sel==i?'s':''} ${tg.includes(i)?'t':''}" onclick="chC(${i})">${c?`<span class="${isW(c)?'pw':'pb'}">${GL[c.toLowerCase()]}\uFE0E</span>`:''}</div>`).join('')+`</div><div class="msg" id="ms">${X.msg}</div><div class="bar"><button class="s" onclick="chI()">Game Baru</button></div>`}
function chC(i){if(X.over||X.ai)return;const c=X.b[i];if(c&&isW(c)){X.sel=i;snd('tick');return chR()}
if(X.sel!=null&&legal(X.b,true).some(m=>m[0]==X.sel&&m[1]==i)){X.b=ap(X.b,[X.sel,i]);X.sel=null;snd('deal');if(!legal(X.b,false).length)return chEnd(inCk(X.b,false));X.ai=1;X.msg='AI berpikir...';chR();setTimeout(chAI,300)}}
function chAI(){const Lg=legal(X.b,false);let best=-1e9,bm;for(const m of Lg){const v=-nm(ap(X.b,m),true,2,-1e9,1e9)+Math.random()*.3;if(v>best){best=v;bm=m}}X.b=ap(X.b,bm);X.ai=0;snd('deal');if(!legal(X.b,true).length)return chEnd(0,inCk(X.b,true));X.msg=inCk(X.b,true)?'Skak! ♚':'Giliranmu';chR()}
function chEnd(w,l){X.over=1;X.ai=0;if(w){pay(150);X.msg='SKAKMAT! Kamu menang +150 🎉';fx(1,1)}else if(l){X.msg='Skakmat. AI menang';fx(0)}else X.msg='Remis (stalemate)';chR()}
